<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jabili Online</title>
    
</head>
<body -user-select:none; style="background-color:red;">
    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/8/84/Jollibee_2011_logo.svg/1280px-Jollibee_2011_logo.svg.png" style="width: 150px; height: 150px; display: block; margin-left: auto; margin-right: auto;">
    <center><h1 style="color: white;">JOLLIBEE ORDERING SYSTEM</h1><br></center>
    <form>
        <label for="name">Full name:</label> 
        <input type="text" id="name" placeholder="Enter your full name"><br><br><label for="date">Date:</label>
        <input type="date" id="date" placeholder="Enter the date"><br><br>
        <label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>
        <h3>MENU</h3>
        <input type="checkbox" id="c" name="menu-item" value="chicken">
        <label for="c">Chicken</label><br>
        <input type="checkbox" id="s" name="menu-item" value="spaghetti">
        <label for="s">Spaghetti</label><br>
        <input type="checkbox" id="sp" name="menu-item" value="spagetti">
        <label for="b">Burger</label><br>
    <h3>DRINKS</h3>
        <input type="radio" id="co">
        <label for="co">Coke</label><br>
        <input type="radio" id="it">
        <label for="it">Iced Tea</label><br>
        <input type="radio" id="sp">
        <label for="sp">Sprite</label><br>
        <input type="radio" id="wa">
        <label for="wa">Water</label><br>
        <select name="size" id="size">
            <option value="size" disabled selected hidden>Select Size</option>
            <option value="s">Small</option>
            <option value="m">Medium</option>
            <option value="l">Large</option> 
            </select><br><br>
        
    <input type="button" value="Submit Order" onclick="window.location.href='https://order.jollibee.com/en/ph/stores?utm_source=google&utm_medium=cpc&utm_campaign=branded_location&utm_term=jollibee%2024%20hours%20near%20me&utm_content=190390177871'">
    <input type="Reset" value="Reset">
    </form>
</body>
